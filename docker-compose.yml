services:
  mysql:
    image: mysql:8.4
    container_name: vip-ia-mysql
    environment:
      MYSQL_DATABASE: vipia
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - vip-ia-mysql-data:/var/lib/mysql
      # executados em ordem alfabetica apenas na primeira subida (volume vazio)
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u$$MYSQL_USER"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vip-ia-mysql-data:
